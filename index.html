<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>VideoExplainer</title>
    <meta name="description" content="Organize your video and audio clips and chat with your personal knowledge base using Gemini AI." />
    <meta property="og:title" content="VideoExplainer" />
    <meta property="og:description" content="Organize your video and audio clips and chat with your personal knowledge base using Gemini AI." />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <script>
      try {
        const saved = localStorage.getItem('videoexplainer_theme') || localStorage.getItem('theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
